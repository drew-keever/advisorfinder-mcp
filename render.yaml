services:
  - type: web
    name: advisorfinder-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 1c-2g  # 1 CPU / 2 GB; 512 MB was OOM-killed ~every 6 days (2026-10-13)
    healthCheckPath: /health
    envVars:
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: advisorfinder-mcp
      - key: DB_DIR
        value: /tmp/adfi
