[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advisorfinder-mcp"
version = "2.0.0"
description = "MCP server and client for SEC-registered financial advisor data — search, profiles, disclosures status, firm fees. By AdvisorFinder."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AdvisorFinder", email = "support@advisorfinder.com" }
]
keywords = ["mcp", "sec", "finra", "financial-advisor", "advisorfinder", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastmcp>=3.4,<4.0",
]

[project.optional-dependencies]
server = ["boto3>=1.34"]

[project.urls]
Homepage = "https://advisorfinder.com"
Repository = "https://github.com/drew-keever/advisorfinder-mcp"
Issues = "https://github.com/drew-keever/advisorfinder-mcp/issues"

[project.scripts]
advisorfinder-mcp = "advisorfinder_mcp.proxy:main"

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/advisorfinder_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
